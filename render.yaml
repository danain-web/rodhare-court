# =====================================================================
# Render Blueprint — Backend API (Node.js + Express)
# ใช้ผ่าน Render Dashboard → New → Blueprint → เลือก GitHub repo นี้
# ค่า sync: false = ต้องกรอกเองใน Dashboard (ห้ามใส่ secret ลงไฟล์นี้)
# =====================================================================
services:
  - type: web
    name: rodhare-court-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # --include=dev: ต้องมี typescript (devDependency) ตอน build แม้ NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "2"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: SUPABASE_BUCKET_NAME
        value: slips
      - key: MAINTENANCE_INTERVAL_MS
        value: "60000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
